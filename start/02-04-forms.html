<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
</head>
<body>
  <form action="" method="post">
    <label for="full-name">Full Name</label>
    <input type="text" id="full-name" placeholder="User Full Name">

    <br>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="user@gmail.com">

    <br>

    <label for="phone-number">Phone Number</label>
    <input type="tel" id="phone-number" placeholder="+971-XX-XXX-XXXX">

    <br>
    
    <label for="date">Date</label>
    <input type="date" id="date">

    <br>
    
    <label for="num-guests">Number of Guests</label>
    <select name="num-guests" id="num-guests">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>

    <button type = "submit">Submit</button>
  </form>
</body>

</html>
